[project]
name = "nucleo-viewer"
version = "0.1.0"
description = "A small local CT and segmentation comparison viewer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pydicom>=3,<4",
  "nibabel>=5.3,<6",
  "Pillow>=11,<13",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
